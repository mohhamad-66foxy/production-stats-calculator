name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            unzip \
            zip \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            wget \
            ca-certificates

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython buildozer

      - name: Setup Android SDK + NDK
        shell: bash
        run: |
          set -euxo pipefail

          export SDKROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDKROOT"
          mkdir -p "$HOME/.buildozer/android/platform"
          cd "$HOME/.buildozer/android/platform"

          if [ ! -d "$SDKROOT/cmdline-tools" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
            unzip -q commandlinetools.zip
            mkdir -p "$SDKROOT/cmdline-tools"
            mv cmdline-tools "$SDKROOT/cmdline-tools/latest"
          fi

          export PATH="$SDKROOT/cmdline-tools/latest/bin:$PATH"

          mkdir -p "$SDKROOT/licenses"
          echo -e "8933bad161af4d5e886c9a2fb5f16e421c2a6fbc" > "$SDKROOT/licenses/android-sdk-license"
          echo -e "d975f3cc7e2ff2b465f0a4f0c0f1b7f0" > "$SDKROOT/licenses/android-sdk-preview-license"

          sdkmanager --sdk_root="$SDKROOT" --install "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.1.8937393" "cmdline-tools;latest"

          ls -la "$SDKROOT/build-tools"
          ls -la "$SDKROOT/ndk"

      - name: Build APK
        shell: bash
        env:
          ANDROID_SDK_ROOT: $HOME/.buildozer/android/platform/android-sdk
          ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
          ANDROID_NDK_ROOT: $HOME/.buildozer/android/platform/android-sdk/ndk/25.1.8937393
        run: |
          set -euxo pipefail
          export PATH="$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin"
          export PATH="$PATH:$HOME/.buildozer/android/platform/android-sdk/platform-tools"

          ls -la "$HOME/.buildozer/android/platform/android-sdk/build-tools"
          ls -la "$HOME/.buildozer/android/platform/android-sdk/ndk"

          buildozer android debug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-stats-calculator-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/logs
            .buildozer/android/platform/*
